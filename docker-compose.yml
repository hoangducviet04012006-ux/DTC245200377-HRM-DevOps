# ==============================================================================
# HỆ THỐNG QUẢN LÝ NHÂN SỰ (HRM) - DOCKER COMPOSE CONFIGURATION
# Đề tài 10: Quản lý nhân viên, phòng ban, chấm công
# Sinh viên: Hoàng Đức Việt - MSSV: DTC245200377
# Commit 2: Tích hợp Prometheus + Grafana Giám sát Container, Web & Database
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Cơ sở dữ liệu PostgreSQL 16
  # ----------------------------------------------------------------------------
  hrm-postgres:
    image: postgres:16-alpine
    container_name: hrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hrm_db}
      POSTGRES_USER: ${POSTGRES_USER:-hrm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-HrmSecureP@ss2026!}
    volumes:
      - hrm_pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - hrm-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hrm_user} -d ${POSTGRES_DB:-hrm_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Ứng dụng Quản lý Nhân sự (Node.js Express + HTML/CSS/JS)
  # ----------------------------------------------------------------------------
  hrm-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: hrm-app:1.0
    container_name: hrm-app
    restart: unless-stopped
    depends_on:
      hrm-postgres:
        condition: service_healthy
    environment:
      DB_HOST: hrm-postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-hrm_db}
      POSTGRES_USER: ${POSTGRES_USER:-hrm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-HrmSecureP@ss2026!}
      APP_PORT: ${APP_PORT:-3000}
      NODE_ENV: production
    networks:
      - hrm-backend
      - hrm-frontend
      - hrm-monitoring

  # ----------------------------------------------------------------------------
  # Công cụ Quản trị Cơ sở dữ liệu pgAdmin 4 Web GUI
  # ----------------------------------------------------------------------------
  hrm-pgadmin:
    image: dpage/pgadmin4:8.11
    container_name: hrm-pgadmin
    restart: unless-stopped
    depends_on:
      hrm-postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@hrm.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-PgAdminSecure2026!}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - hrm_pgadmin_data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - hrm-backend
      - hrm-frontend

  # ----------------------------------------------------------------------------
  # Nginx Reverse Proxy (HTTPS/TLS + Security Headers)
  # ----------------------------------------------------------------------------
  hrm-nginx:
    image: nginx:1.25-alpine
    container_name: hrm-nginx
    restart: unless-stopped
    depends_on:
      - hrm-app
      - hrm-pgadmin
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - hrm-frontend

  # ----------------------------------------------------------------------------
  # Prometheus PostgreSQL Exporter
  # ----------------------------------------------------------------------------
  hrm-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: hrm-postgres-exporter
    restart: unless-stopped
    depends_on:
      hrm-postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-hrm_user}:${POSTGRES_PASSWORD:-HrmSecureP@ss2026!}@hrm-postgres:5432/${POSTGRES_DB:-hrm_db}?sslmode=disable"
    networks:
      - hrm-backend
      - hrm-monitoring

  # ----------------------------------------------------------------------------
  # Prometheus Time-Series Metrics Server
  # ----------------------------------------------------------------------------
  hrm-prometheus:
    image: prom/prometheus:latest
    container_name: hrm-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - hrm_prometheus_data:/prometheus
    networks:
      - hrm-monitoring
      - hrm-backend
      - hrm-frontend

  # ----------------------------------------------------------------------------
  # Grafana Visualization & Analytics
  # ----------------------------------------------------------------------------
  hrm-grafana:
    image: grafana/grafana:latest
    container_name: hrm-grafana
    restart: unless-stopped
    depends_on:
      - hrm-prometheus
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-GrafanaSecure2026!}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards/hrm:ro
      - hrm_grafana_data:/var/lib/grafana
    networks:
      - hrm-monitoring
      - hrm-frontend

# ------------------------------------------------------------------------------
# Cấu hình Mạng Cách ly (Network Isolation - Hardening)
# ------------------------------------------------------------------------------
networks:
  hrm-frontend:
    driver: bridge
    name: hrm-frontend-network
  hrm-backend:
    driver: bridge
    name: hrm-backend-network
  hrm-monitoring:
    driver: bridge
    name: hrm-monitoring-network

# ------------------------------------------------------------------------------
# Phân vùng Dữ liệu (Persistent Data Volumes)
# ------------------------------------------------------------------------------
volumes:
  hrm_pgdata:
    name: hrm_pgdata
  hrm_pgadmin_data:
    name: hrm_pgadmin_data
  hrm_prometheus_data:
    name: hrm_prometheus_data
  hrm_grafana_data:
    name: hrm_grafana_data
