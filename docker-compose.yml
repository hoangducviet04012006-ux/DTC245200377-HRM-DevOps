# ==============================================================================
# HỆ THỐNG QUẢN LÝ NHÂN SỰ (HRM) - DOCKER COMPOSE CONFIGURATION
# Đề tài 10: Quản lý nhân viên, phòng ban, chấm công
# Sinh viên: Hoàng Đức Việt - MSSV: DTC245200377
# Commit 3: Loki + Promtail LogQL + Security Hardening (Non-root, Network, Limits)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Cơ sở dữ liệu PostgreSQL 16 (Hardened, Network Isolated)
  # ----------------------------------------------------------------------------
  hrm-postgres:
    image: postgres:16-alpine
    container_name: hrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hrm_db}
      POSTGRES_USER: ${POSTGRES_USER:-hrm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER:-hrm_app_user}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      EXPORTER_DB_USER: ${EXPORTER_DB_USER:-hrm_exporter_user}
      EXPORTER_DB_PASSWORD: ${EXPORTER_DB_PASSWORD}
    volumes:
      - hrm_pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/init-roles.sh:/docker-entrypoint-initdb.d/02-init-roles.sh:ro
    networks:
      - hrm-backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hrm_user} -d ${POSTGRES_DB:-hrm_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Ứng dụng Web HRM Core (Non-root user node, Healthcheck, Metrics)
  # ----------------------------------------------------------------------------
  hrm-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: hrm-app:1.0
    container_name: hrm-app
    restart: unless-stopped
    depends_on:
      hrm-postgres:
        condition: service_healthy
    environment:
      DB_HOST: hrm-postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-hrm_db}
      APP_DB_USER: ${APP_DB_USER:-hrm_app_user}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-hrm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_PORT: ${APP_PORT:-3000}
      NODE_ENV: production
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      ADMIN_FORCE_PASSWORD_SYNC: ${ADMIN_FORCE_PASSWORD_SYNC:-false}
    networks:
      - hrm-backend
      - hrm-frontend
      - hrm-monitoring
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 384M

  # ----------------------------------------------------------------------------
  # pgAdmin 4 Web GUI (Pre-configured DB Connection)
  # ----------------------------------------------------------------------------
  hrm-pgadmin:
    image: dpage/pgadmin4:8.11
    container_name: hrm-pgadmin
    restart: unless-stopped
    depends_on:
      hrm-postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@hrm.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - hrm_pgadmin_data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - hrm-backend
      - hrm-frontend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M

  # ----------------------------------------------------------------------------
  # Nginx Reverse Proxy (SSL/TLS + Security Headers Hardening)
  # ----------------------------------------------------------------------------
  hrm-nginx:
    image: nginx:1.25-alpine
    container_name: hrm-nginx
    restart: unless-stopped
    depends_on:
      - hrm-app
      - hrm-pgadmin
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - hrm-frontend
      - hrm-monitoring
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  # ----------------------------------------------------------------------------
  # Prometheus Nginx Exporter (Scrapes internal stub_status on port 8080)
  # ----------------------------------------------------------------------------
  hrm-nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: hrm-nginx-exporter
    restart: unless-stopped
    depends_on:
      - hrm-nginx
    command:
      - -nginx.scrape-uri=http://hrm-nginx:8080/stub_status
    networks:
      - hrm-monitoring
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M

  # ----------------------------------------------------------------------------
  # cAdvisor Container Metrics Agent (Independent instance for HRM)
  # ----------------------------------------------------------------------------
  hrm-cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: hrm-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - hrm-monitoring
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ----------------------------------------------------------------------------
  # Prometheus PostgreSQL Exporter
  # ----------------------------------------------------------------------------
  hrm-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: hrm-postgres-exporter
    restart: unless-stopped
    depends_on:
      hrm-postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://${EXPORTER_DB_USER:-hrm_exporter_user}:${EXPORTER_DB_PASSWORD}@hrm-postgres:5432/${POSTGRES_DB:-hrm_db}?sslmode=disable"
    networks:
      - hrm-backend
      - hrm-monitoring

  # ----------------------------------------------------------------------------
  # Prometheus Time-Series Metrics Server
  # ----------------------------------------------------------------------------
  hrm-prometheus:
    image: prom/prometheus:v3.14.0
    container_name: hrm-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - hrm_prometheus_data:/prometheus
    networks:
      - hrm-monitoring
      - hrm-backend
      - hrm-frontend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ----------------------------------------------------------------------------
  # Grafana Visualization & Analytics
  # ----------------------------------------------------------------------------
  hrm-grafana:
    image: grafana/grafana:13.2.1
    container_name: hrm-grafana
    restart: unless-stopped
    depends_on:
      - hrm-prometheus
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana-dashboards:ro
      - hrm_grafana_data:/var/lib/grafana
    networks:
      - hrm-monitoring
      - hrm-frontend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ----------------------------------------------------------------------------
  # Grafana Loki - Log Aggregation Engine
  # ----------------------------------------------------------------------------
  hrm-loki:
    image: grafana/loki:3.7.7
    container_name: hrm-loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3101}:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./logging/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - hrm_loki_data:/loki
    networks:
      - hrm-monitoring
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ----------------------------------------------------------------------------
  # Promtail - Log Shipping Agent
  # ----------------------------------------------------------------------------
  hrm-promtail:
    image: grafana/promtail:3.6.8
    container_name: hrm-promtail
    restart: unless-stopped
    depends_on:
      - hrm-loki
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logging/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
    networks:
      - hrm-monitoring

# ------------------------------------------------------------------------------
# Cấu hình Mạng Cách ly (Network Isolation - Hardening)
# ------------------------------------------------------------------------------
networks:
  hrm-frontend:
    driver: bridge
    name: hrm-frontend-network
  hrm-backend:
    driver: bridge
    name: hrm-backend-network
  hrm-monitoring:
    driver: bridge
    name: hrm-monitoring-network

# ------------------------------------------------------------------------------
# Phân vùng Dữ liệu (Persistent Data Volumes)
# ------------------------------------------------------------------------------
volumes:
  hrm_pgdata:
    name: hrm_pgdata
  hrm_pgadmin_data:
    name: hrm_pgadmin_data
  hrm_prometheus_data:
    name: hrm_prometheus_data
  hrm_grafana_data:
    name: hrm_grafana_data
  hrm_loki_data:
    name: hrm_loki_data
